<!-- ============ HEADER ============ -->
<header class="site-header" id="site-header">
  <a class="site-header__logo" href="{{logo_href}}" aria-label="PinkOut Partners, back to top" data-i18n-attr="aria-label:logoLabel"><img src="assets/images/logo-cherry.svg?v=1" alt="" width="102" height="36"></a>
  <nav class="site-nav" aria-label="Sections" data-i18n-attr="aria-label:navLabel">
    <a href="event.html"{{cur_event}} data-i18n="navEvent">Event partners</a>
    <a href="beauty.html"{{cur_beauty}} data-i18n="navBeauty">Beauty services</a>
    <a href="shop.html"{{cur_shop}} data-i18n="navShop">E-commerce</a>
    <a href="{{home}}#world" class="nav-optional" data-i18n="navWorld">The world</a>
    <a href="{{home}}#faq" data-i18n="navFaq">FAQ</a>
  </nav>
  <div class="site-header__actions">
    <button class="btn btn--quiet btn--sm lang-switch" type="button" data-lang-toggle lang="ar">العربية</button>
    <button class="btn btn--sm" type="button" data-apply data-source="header" data-i18n="ctaPartner">Become a partner</button>
    <button class="btn btn--secondary btn--icon menu-btn" type="button" aria-label="Menu" aria-controls="menu-sheet" aria-expanded="false" data-menu-open data-i18n-attr="aria-label:menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>

<dialog class="menu-sheet" id="menu-sheet" aria-label="Menu" data-i18n-attr="aria-label:menu">
  <div class="menu-sheet__top">
    <img src="assets/images/logo-cherry.svg?v=1" alt="PinkOut" width="91" height="32">
    <button class="btn btn--secondary btn--icon" type="button" aria-label="Close menu" data-menu-close data-i18n-attr="aria-label:menuClose">✕</button>
  </div>
  <nav aria-label="Menu" data-i18n-attr="aria-label:menu">
    <a href="event.html"{{cur_event}} data-menu-link data-i18n="navEvent">Event partners</a>
    <a href="beauty.html"{{cur_beauty}} data-menu-link data-i18n="navBeauty">Beauty services</a>
    <a href="shop.html"{{cur_shop}} data-menu-link data-i18n="navShop">E-commerce</a>
    <a href="{{home}}#world" data-menu-link data-i18n="navWorld">The world</a>
    <a href="{{home}}#faq" data-menu-link data-i18n="navFaq">FAQ</a>
  </nav>
  <div class="menu-sheet__actions">
    <button class="btn btn--block" type="button" data-apply data-source="menu" data-i18n="ctaPartner">Become a partner</button>
    <button class="btn btn--secondary btn--block" type="button" data-lang-toggle lang="ar">العربية</button>
  </div>
</dialog>
