# PinkOut Partners — Nginx site config
# ❓ DOMAIN: placeholder partners.pinkoutsa.com. Replace with the real partner domain and its certificate paths. (place in /etc/nginx/sites-available/ or conf.d/).
# Compression, browser caching and HTTP/2 make the site load fast; nothing else is required.
# If the server already has its own certificate lines, keep those instead of the ssl_* lines below.

# Files requested with ?v=N (all CSS/JS, the hero film and posters) never change at that URL,
# so browsers keep them for a year. Files without ?v= are re-checked once a day.
map $arg_v $pinkout_expires {
    ""      1d;
    default 1y;
}

server {
    listen 80;
    listen [::]:80;
    server_name partners.pinkoutsa.com;
    return 301 https://partners.pinkoutsa.com$request_uri;
}

server {
    # On Nginx 1.25.1+ you may write "listen 443 ssl;" plus "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name partners.pinkoutsa.com;

    ssl_certificate     /etc/letsencrypt/live/partners.pinkoutsa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partners.pinkoutsa.com/privkey.pem;

    root /var/www/partners.pinkoutsa.com;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain text/xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Pages: always check for a newer version, so updates appear immediately.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(css|js|webp|jpg|jpeg|png|svg|ico|mp4|json)$ {
        expires $pinkout_expires;
        try_files $uri =404;
    }

    location ~* \.woff2$ {
        expires 1y;
        try_files $uri =404;
    }

    # Planning notes are not part of the public site.
    location ~* \.md$ {
        return 404;
    }

    # Internal review files (planning docs, wireframe, component library, archived demo) stay private.
    location ~ ^/(docs|_archive|src|tools|\.claude)/ {
        return 404;
    }
    location ~ ^/(wireframe|components)\.html$ {
        return 404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
